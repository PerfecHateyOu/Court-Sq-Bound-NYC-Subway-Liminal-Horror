name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from Oct 19, 2026. The browser
    # tests depend on Playwright's system packages (--with-deps) and software WebGL timings, so
    # change the OS on purpose, in its own PR, once the Playwright version in e2e/ supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # A frozen install with no lockfile at all would pass, so check it's there first.
      - name: bun.lock exists
        run: |
          for f in bun.lock e2e/bun.lock; do
            if [ ! -f "$f" ]; then
              echo "::error title=$f is missing::$f is missing. Run 'bun install' (in e2e/ for e2e/bun.lock) and commit it."
              exit 1
            fi
          done
      # AI Studio re-pushes its starter bun.lock on every sync, so package.json lists the
      # same packages that lock does (see README). This check stays strict.
      - name: Check bun.lock matches package.json
        run: |
          if bun install --frozen-lockfile; then
            exit 0
          fi
          bun install
          diff=$(git diff -U0 bun.lock)
          pkgs() { echo "$diff" | sed -nE "s/^[$1]        \"([^\"]+)\": \".*/\1/p" | sort -u; }
          removed=$(comm -23 <(pkgs -) <(pkgs +))
          added=$(comm -13 <(pkgs -) <(pkgs +))
          msg="bun.lock doesn't match package.json (this usually happens after an AI Studio export). To fix it, run 'bun install' and commit the updated bun.lock, or ask Tab to open a fix PR."
          echo "::error title=bun.lock is out of date::$msg"
          {
            echo "## bun.lock is out of date"
            echo
            echo "$msg"
            echo
            echo "Packages in bun.lock that are not in package.json (would be removed):"
            echo "${removed:-none}" | sed 's/^/- /'
            echo
            echo "Packages in package.json that are missing from bun.lock (would be added):"
            echo "${added:-none}" | sed 's/^/- /'
            echo
            echo '```'
            git diff --stat bun.lock
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # AI Studio installs with npm, which (unlike bun) refuses peer-dependency conflicts:
      # when that happens its dev server can't start. Catch it here first.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: npm can install package.json (AI Studio's dev server needs this)
        run: |
          if ! npm install --dry-run --no-audit --no-fund > npm-check.log 2>&1; then
            cat npm-check.log
            echo "::error title=npm install fails::npm can't install package.json (usually a peer-dependency conflict, shown above), so AI Studio's dev server won't start. Fix the versions in package.json."
            exit 1
          fi
      # Playwright lives in e2e/ with its own lockfile; the type-check covers e2e/ too.
      - name: Install e2e deps
        run: bun install --frozen-lockfile
        working-directory: e2e
      - run: bun run lint
      - run: bun run build
      - name: Production build has no test hooks
        run: "! grep -l '__G' dist/assets/*.js"

  e2e:
    name: Browser tests
    needs: build
    runs-on: ubuntu-24.04 # see the build job
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Install e2e deps
        run: bun install --frozen-lockfile
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # The offline copy (one index.html that opens from a double-click) is rebuilt on every
      # change, tested by e2e/offline.spec.ts, and attached to the run as a download.
      - name: Build the offline copy
        run: bun run build:offline
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        with:
          name: Last-Local-offline
          path: dist-offline/Last-Local/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7
